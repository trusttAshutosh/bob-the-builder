# Product feature integrity — runs on every push/PR with doc-lint.
name: Bob product verify
on:
  pull_request:
    paths:
      - '**/*'
  push:
    branches: [master, main]
jobs:
  verify-features:
    runs-on: ubuntu-latest
    env:
      BOB_PRODUCT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Verify registered features intact
        run: |
          python3 runner/ci/verify-product.py --check
          BOB_PRODUCT_ROOT="${{ github.workspace }}" python3 bob.py refresh-samples
          if ! git diff --quiet assets/examples/sample-validate-output; then
            echo "::error::Sample output bundle is stale — run: python bob.py refresh-samples && commit"
            git diff --stat assets/examples/sample-validate-output
            exit 1
          fi
          python3 runner/ci/verify-product.py --update
          if ! git diff --quiet docs/NEXT.md; then
            echo "::warning::docs/NEXT.md auto-sections differ from HEAD — run locally: python bob.py verify-product --update"
          fi
