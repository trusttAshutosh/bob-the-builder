# Sample ticket — shapes Bob's validate-ticket outputs (regenerated by bob refresh-samples).
version: 2

ticket:
  id: sample-gateway-health-check
  title: Sample gateway health and audit proof
  description: |
    Demonstration ticket for Bob documentation. Not tied to a live service run.
    See REQUIREMENT.md for the fictional user story.
  acceptance_criteria:
    - API returns success for the happy-path scenario
    - transaction_audit row matches expected status and result codes

git:
  branch_policy: none
  commit_policy: no_commit

env_profile: local-dsa

impacted:
  feature: sample-gateway
  gateway_apis:
    - inquireCardEligibility
  processor_beans:
    - inquireCardEligibilityProcessor
  repos:
    - novopay-platform-creditcard-management
  channel_matrix: [DAP]

run:
  auto_boot_services: false
  auto_discover_services: false
  wiremock_port: 9090
  audit_db: dsa_credit_card_mgmt
  kafka:
    mode: auto
  redis:
    mode: auto
  graph:
    sync_obsidian: false
  eval:
    mode: check
  postman:
    local_gateway_base: http://localhost:8080/api-gateway
    local_service_base: http://localhost:8016/cc-mgmt

stubs:
  - ref: bank-operations/getCardSummary/success-200

scenarios:
  - id: S1
    name: Happy path — eligibility inquiry
    verification_level: e2e
    steps:
      - api_id: inquireCardEligibility
    log_patterns:
      - "inquireCardEligibility"
    db:
      expect:
        txn_status: SUCCESS
        txn_result_code: "000"
  - id: S2
    name: Integration — processor unit scope
    verification_level: integration
    steps: []

kafka_scenarios:
  - id: K1
    name: Sample consume check
    topic: dsa_dev_sample_events
    action: consume
    max_messages: 5

evidence_required:
  - transaction_audit
  - api_response
  - logs
  - kafka
  - redis
