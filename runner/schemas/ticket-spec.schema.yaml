# Ticket Spec (TS) — single source of truth per validation run (Bob the Builder)
# CC-shaped example: assets/examples/novopay-cc/ and deploy/tdd/env-local-dsa.yaml
version: 2

ticket:
  id: TICKET-001
  title: Short title
  description: |
    Acceptance criteria and context.
  acceptance_criteria:
    - Measurable outcome 1

git:
  branch_policy: none  # none | novopay-feature — Bob never commits; novopay-feature may checkout feature branch
  base_branch: ddp-prod      # when branch_policy: novopay-feature
  branch_prefix: ddp-fea-    # when branch_policy: novopay-feature
  commit_policy: no_commit   # informational only

# Host deploy/tdd/env-<name>.yaml — CC dogfood uses local-dsa (see templates/host-deploy-tdd/)
env_profile: local-dsa

impacted:
  feature: ""  # optional tag for assertion-catalog/<feature>.yaml
  gateway_apis: []
  bank_operations: []
  processor_beans: []
  repos:
    - HOST_REPO_FOLDER
  channel_matrix: [DAP]

run:
  auto_boot_services: true
  auto_discover_services: true  # host properties + Java imports + local/agent/required-services.yaml
  boot_policy: changed_only  # changed_only | all — boot only impacted repos; mock unchanged peers via WireMock
  boot_confirm: prompt  # prompt | never — confirm boot plan before bootRun (default yes; type 'all' to boot everything)
  e2e_first: true  # run integration/e2e scenarios before any unit scenarios
  fail_fast_on_e2e_block: true  # skip unit when E2E cannot run (unit does not replace live proof)
  unit_tests: false  # Gradle test only when true; default proof is E2E (API + DB + logs)
  boot_wait_seconds: 180
  audit_db: dsa_credit_card_mgmt  # override per service; see deploy/tdd mysql.schemas.audit
  wiremock_port: 9090
  kafka:
    mode: auto  # auto | on | off
  redis:
    mode: auto  # auto | on | off — CC config cache when masterdata/stubs

# Stub registry refs: stub-registry/bank-operations/<op>/<fixture>.yaml
stubs: []

# Masterdata URL overrides when using WireMock (prop_key / prop_value; use {WIREMOCK_PORT})
masterdata: []

# transaction_audit | api_response | logs | kafka | redis
evidence_required:
  - transaction_audit
  - api_response
  - logs
  # - kafka
  # - redis

scenarios:
  - id: S1
    name: Primary scenario
    verification_level: e2e  # unit | integration | e2e
    # gradle_tests: in.novopay.example.SomeTest  # required for verification_level: unit
    steps: []
    #  - api_id: <from api-catalog after discover>
    log_patterns: []
    db: {}
    #  assertion_preset: <from assertion-catalog preset name>
