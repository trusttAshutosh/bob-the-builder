# Non-CC fixture profile (payments-shaped). Filename matches bob-defaults env_profile lookup.
header_profile: dsa-agent-app
primary_service: payments_management
gateway_v2_segment: payments_management

services:
  payments_management:
    base_env_var: PAYMENTS_BASE
    default_base: http://localhost:8020/payments
    health_path: /actuator/health
    boot:
      task: bootRun

mysql:
  schemas:
    audit: dsa_payments

audit:
  table: transaction_audit
  crn_column: client_reference_code
  order_by: updated_on DESC
  columns:
    - txn_status
