# Novopay DSA workspace map — copy to host repo deploy/tdd/workspace-services.yaml
# Service keys must match deploy/tdd/env-local-dsa.yaml (or set workspace_key there).

services:
  credit_card_management:
    repo_dir: novopay-platform-creditcard-management
    config_files:
      - src/main/resources/application.properties
    boot:
      task: bootRun
      args: []

  masterdata_management:
    repo_dir: novopay-platform-masterdata-management
    config_files:
      - src/main/resources/application.properties
    boot:
      task: bootRun
      args: []
